<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1094 908" width="1094" height="908" role="img" aria-labelledby="bb-t">
<title id="bb-t">Dashboard rendering</title>
<style>
text{font-family:Geist,"Geist Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-variant-numeric:tabular-nums}
.bb-title{font-size:36px;font-weight:300;letter-spacing:-.015em}
.bb-subtitle{font-size:14px;font-weight:400}
.bb-kicker-top{font-size:10.5px;font-weight:500;letter-spacing:2.6px}
.bb-meta{font-size:11px;font-weight:400;letter-spacing:.03em}
.bb-meter-big{font-size:42px;font-weight:300;letter-spacing:-.02em}
.bb-meter-unit{font-size:17px;font-weight:300}
.bb-meter-track{stroke-width:1;fill:none}
.bb-meter-solid,.bb-meter-part{stroke-width:3;fill:none}
.bb-meter-part{stroke-dasharray:2 3}
.bb-rule{stroke-width:1;fill:none}
.bb-zone{stroke-width:1}
.bb-zone-kicker{font-size:10.5px;font-weight:500;letter-spacing:2.6px}
.bb-zone-title{font-size:21px;font-weight:400;letter-spacing:-.005em}
.bb-zone-sub{font-size:11.5px}
.bb-node-box{stroke-width:1}
.bb-node.status-planned .bb-node-box{stroke-dasharray:4 4}
.bb-kicker{font-size:10.5px;font-weight:500;letter-spacing:2.4px}
.bb-node-title{font-size:17px;font-weight:500;letter-spacing:-.005em}
.bb-copy{font-size:13.5px;font-weight:400}
.bb-hint{font-size:11.5px;font-weight:400;letter-spacing:.02em}
.bb-status-text{font-size:9.5px;font-weight:600;letter-spacing:1.9px}
.bb-dot{stroke-width:1.1;fill:none}
.bb-edge{fill:none;stroke-width:1.25;stroke-linejoin:round;stroke-linecap:round}
.bb-edge.control{stroke-dasharray:3 4}
.bb-edge.failure{stroke-dasharray:.1 4.5;stroke-width:1.8}
.bb-edge.is-planned{opacity:.4}
.bb-label{font-size:11.5px;font-weight:500;letter-spacing:.02em;paint-order:stroke;stroke-width:6px;stroke-linejoin:round}
.bb-legend-text{font-size:12px;font-weight:400}
.bb-finding-text{font-size:9px;font-weight:600;letter-spacing:1.6px}
.iso-face{stroke-width:.8;stroke-linejoin:round}
.bb-node.status-planned .iso-face{fill:none;stroke-dasharray:4 4;stroke-width:1}
.iso-hatch line{stroke-width:.8;opacity:.45}
.iso-label-knockout{paint-order:stroke;stroke-width:6px;stroke-linejoin:round}
.bb-canvas{fill:#1a1816}
.bb-title,.bb-zone-title,.bb-node-title,.bb-meter-big,.bb-meter-unit{fill:#ead1b5}
.bb-subtitle,.bb-copy,.bb-hint,.bb-legend-text,.bb-meta,.bb-kicker,.bb-zone-kicker,.bb-kicker-top,.bb-zone-sub{fill:#b09080}
.bb-rule,.bb-meter-track{stroke:#35302b}
.bb-meter-solid{stroke:#ead1b5}
.bb-meter-part{stroke:#b09080}
.bb-zone{fill:#1f1c19;stroke:#35302b}
.bb-node-box{fill:#272421;stroke:#35302b}
.bb-node.status-planned .bb-node-box{fill:none;stroke:#4c443c}
.bb-node.status-planned .bb-node-title{fill:#b09080}
.bb-status-text{fill:#b09080}
.bb-status.is-implemented .bb-status-text{fill:#b09080}
.bb-dot{stroke:#b09080}
.bb-dot-fill{fill:#b09080}
.bb-status.is-implemented .bb-dot{stroke:#ead1b5}
.bb-status.is-implemented .bb-dot-fill{fill:#ead1b5}
.bb-edge.data{stroke:#958574}
.bb-edge.control{stroke:#6b737e}
.bb-edge.failure{stroke:#c27a5c}
.bb-arrow.data{fill:#958574}
.bb-arrow.control{fill:#6b737e}
.bb-arrow.failure{fill:#c27a5c}
.bb-label,.iso-label-knockout{stroke:#1a1816}
.bb-label.data{fill:#b09080}
.bb-label.control{fill:#a4a8ae}
.bb-label.failure{fill:#c27a5c}
.bb-flow{stroke:#ead1b5;stroke-opacity:.55}
.bb-finding-text,.bb-finding-inline{fill:#c27a5c}
.bb-node.has-finding .bb-node-box{stroke:#c27a5c}
.bb-pseudo-fill{fill:#ead1b5}
.bb-pseudo-ring{fill:#1a1816;stroke:#ead1b5;stroke-width:1.3}
.bb-pseudo-choice{fill:#272421}
.bb-node.is-selected .bb-node-box,.bb-node[tabindex]:focus .bb-node-box{stroke:#ead1b5}
.cat-sage .bb-mark,.bb-mark.cat-sage{fill:#7fbd9e}
.cat-sage .bb-kicker,.cat-sage .bb-zone-kicker{fill:#89b498}
.cat-sage .bb-node-box{fill:#353c35;stroke:#475b4e}
.cat-sage.status-planned .bb-node-box{fill:none;stroke:#476253}
.bb-zone.cat-sage{fill:#212420;stroke:#344339}
.cat-sage .iso-roof{fill:#8fb7a3;stroke:#48705c}
.cat-sage .iso-left{fill:#70a48a;stroke:#48705c}
.cat-sage .iso-right{fill:#5a8c73;stroke:#48705c}
.cat-sage.status-planned .iso-face{stroke:#79c39e}
.cat-teal .bb-mark,.bb-mark.cat-teal{fill:#7aadae}
.cat-teal .bb-kicker,.cat-teal .bb-zone-kicker{fill:#85a7a5}
.cat-teal .bb-node-box{fill:#343a38;stroke:#455554}
.cat-teal.status-planned .bb-node-box{fill:none;stroke:#455b5a}
.bb-zone.cat-teal{fill:#212221;stroke:#333f3e}
.cat-teal .iso-roof{fill:#8fb7b7;stroke:#486f70}
.cat-teal .iso-left{fill:#70a2a4;stroke:#486f70}
.cat-teal .iso-right{fill:#5a8b8c;stroke:#486f70}
.cat-teal.status-planned .iso-face{stroke:#3f6f70}
.cat-mustard .bb-mark,.bb-mark.cat-mustard{fill:#c2aa6a}
.cat-mustard .bb-kicker,.cat-mustard .bb-zone-kicker{fill:#bea56e}
.cat-mustard .bb-node-box{fill:#40392d;stroke:#5f543b}
.cat-mustard.status-planned .bb-node-box{fill:none;stroke:#665a3c}
.bb-zone.cat-mustard{fill:#26221c;stroke:#463e2c}
.cat-mustard .iso-roof{fill:#b7ad8f;stroke:#706548}
.cat-mustard .iso-left{fill:#a49670;stroke:#706548}
.cat-mustard .iso-right{fill:#8c7e5a;stroke:#706548}
.cat-mustard.status-planned .iso-face{stroke:#ceb05e}
.cat-mauve .bb-mark,.bb-mark.cat-mauve{fill:#ae7a9d}
.cat-mauve .bb-kicker,.cat-mauve .bb-zone-kicker{fill:#ae7e97}
.cat-mauve .bb-node-box{fill:#3d3235;stroke:#58434e}
.cat-mauve.status-planned .bb-node-box{fill:none;stroke:#5d4453}
.bb-zone.cat-mauve{fill:#241f1f;stroke:#403139}
.cat-mauve .iso-roof{fill:#b196a8;stroke:#694e61}
.cat-mauve .iso-left{fill:#9b7890;stroke:#694e61}
.cat-mauve .iso-right{fill:#846279;stroke:#694e61}
.cat-mauve.status-planned .iso-face{stroke:#76536b}
.cat-olive .bb-mark,.bb-mark.cat-olive{fill:#a5ae7a}
.cat-olive .bb-kicker,.cat-olive .bb-zone-kicker{fill:#a7a87b}
.cat-olive .bb-node-box{fill:#3b3a2f;stroke:#545641}
.cat-olive.status-planned .bb-node-box{fill:none;stroke:#595c43}
.bb-zone.cat-olive{fill:#24231d;stroke:#3e3f30}
.cat-olive .iso-roof{fill:#acb096;stroke:#65694f}
.cat-olive .iso-left{fill:#959a79;stroke:#65694f}
.cat-olive .iso-right{fill:#7e8363;stroke:#65694f}
.cat-olive.status-planned .iso-face{stroke:#6e7354}
.cat-slate .bb-mark,.bb-mark.cat-slate{fill:#7a92ae}
.cat-slate .bb-kicker,.cat-slate .bb-zone-kicker{fill:#8592a5}
.cat-slate .bb-node-box{fill:#343638;stroke:#454c54}
.cat-slate.status-planned .bb-node-box{fill:none;stroke:#454f5a}
.bb-zone.cat-slate{fill:#212121;stroke:#33383e}
.cat-slate .iso-roof{fill:#96a2b0;stroke:#4f5b69}
.cat-slate .iso-left{fill:#79889a;stroke:#4f5b69}
.cat-slate .iso-right{fill:#637183;stroke:#4f5b69}
.cat-slate.status-planned .iso-face{stroke:#617082}
.iso-shadow{fill:#000000;fill-opacity:0.32}
.iso-hatch line{stroke:#1a1816}
.iso-tag-bg,.iso-label-bg{fill:#1a1816;fill-opacity:.9}
.bb-label.plain{stroke:none}
.bb-node:not([class*=cat-]) .iso-face{fill:#272421;stroke:#35302b}
.bb-flow{fill:none;stroke-width:2.4;stroke-linecap:round;stroke-dasharray:.1 28;animation:bb-flow 2.6s linear infinite}
@keyframes bb-flow{to{stroke-dashoffset:-28.1}}
@media (prefers-reduced-motion:reduce){.bb-flow{animation:none;opacity:0}}
</style>
<defs><marker id="bb-arrow-data" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path class="bb-arrow data" d="M 0 1 L 10 5 L 0 9 z"/></marker><marker id="bb-arrow-control" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path class="bb-arrow control" d="M 0 1 L 10 5 L 0 9 z"/></marker><marker id="bb-arrow-failure" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path class="bb-arrow failure" d="M 0 1 L 10 5 L 0 9 z"/></marker></defs>
